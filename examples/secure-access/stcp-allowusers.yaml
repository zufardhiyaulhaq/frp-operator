# STCP with allowUsers: only visitors running as frp user "alice" or "bob" may connect.
#
# frps namespaces proxies by the owning client's `user`, so a cross-user setup needs:
#   - the publishing Client to set `user` (here: api-team),
#   - the visiting Client to set its own `user` (one listed in allowUsers),
#   - the Visitor to name the owner with `serverUser`.
# Both Clients use the frp-token Secret defined in client-tls.yaml.
---
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Client
metadata:
  name: secure-client
spec:
  user: api-team
  server:
    host: frp.example.com
    port: 7000
    authentication:
      token:
        secret:
          name: frp-token
          key: token
---
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Upstream
metadata:
  name: private-api
spec:
  client: secure-client
  stcp:
    host: api-service.default.svc
    port: 8080
    secretKey:
      secret:
        name: stcp-secret
        key: secretKey
    allowUsers:
      - "alice"
      - "bob"
---
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Client
metadata:
  name: alice-client
spec:
  user: alice
  server:
    host: frp.example.com
    port: 7000
    authentication:
      token:
        secret:
          name: frp-token
          key: token
---
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Visitor
metadata:
  name: private-api-visitor
spec:
  client: alice-client
  stcp:
    host: 0.0.0.0
    port: 8080
    serverUser: api-team
    serverName: private-api
    serverSecretKey:
      secret:
        name: stcp-secret
        key: secretKey
---
apiVersion: v1
kind: Secret
metadata:
  name: stcp-secret
type: Opaque
stringData:
  secretKey: "my-stcp-secret-key"
