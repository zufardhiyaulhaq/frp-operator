# Example: Client with PodTemplate customization
# This example demonstrates how to customize the FRP client pod
# with resource limits, node scheduling, and security settings.
---
apiVersion: v1
kind: Secret
metadata:
  name: frp-token
type: Opaque
stringData:
  token: "your-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-creds
type: Opaque
stringData:
  username: "admin"
  password: "admin-password"
---
apiVersion: frp.zufardhiyaulhaq.com/v1alpha1
kind: Client
metadata:
  name: production-client
spec:
  server:
    host: frp.example.com
    port: 7000
    authentication:
      token:
        secret:
          name: frp-token
          key: token
    adminServer:
      port: 7400
      pprofEnable: true
      username:
        secret:
          name: admin-creds
          key: username
      password:
        secret:
          name: admin-creds
          key: password
  podTemplate:
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "frp"
        effect: "NoSchedule"
    labels:
      app.kubernetes.io/part-of: my-application
    annotations:
      prometheus.io/scrape: "true"
    serviceAccountName: frp-client-sa
    priorityClassName: high-priority
    env:
      - name: GOMEMLIMIT
        value: "200MiB"
