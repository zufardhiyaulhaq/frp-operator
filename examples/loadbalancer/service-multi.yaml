apiVersion: v1
kind: Service
metadata:
  name: web-multi
  namespace: default
  annotations:
    frp.zufardhiyaulhaq.com/server: sg-01,sg-02
spec:
  type: LoadBalancer
  loadBalancerClass: frp.zufardhiyaulhaq.com/frp
  selector:
    app: web
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
