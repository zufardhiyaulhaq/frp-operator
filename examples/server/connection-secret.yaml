# Private cluster: a copy of public-01-connection from the public cluster, for example
#   kubectl --context public get secret public-01-connection -o json \
#     | jq '{apiVersion, kind, type, data, metadata: {name: .metadata.name}}' \
#     | kubectl --context private apply -f -
# or any secret-sync tool.
apiVersion: v1
kind: Secret
metadata:
  name: public-01-connection
stringData:
  token: replace-with-the-copied-token
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    copied from the public cluster
    -----END CERTIFICATE-----
