# Credentials for the frps token, the egress proxy, and (for client-oidc.yaml) the OIDC client.
apiVersion: v1
kind: Secret
metadata:
  name: frp-token
  namespace: default
type: Opaque
stringData:
  token: "your-secret-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-proxy-credentials
  namespace: default
type: Opaque
stringData:
  username: "svc-frp"
  # Any characters are fine: the operator URL-escapes them into transport.proxyURL.
  password: "p@ss:w/rd"
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-creds
  namespace: default
type: Opaque
stringData:
  client-id: "frpc"
  client-secret: "your-oidc-client-secret"
