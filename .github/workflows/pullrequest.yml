name: pull_request

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23
      - name: Check out code
        uses: actions/checkout@v2
      - name: Run tests
        run: make test
  frpc-config:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23
      - name: Check out code
        uses: actions/checkout@v2
      - name: Validate generated frpc config with frpc
        run: make test-frpc-config
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23
      - name: Check out code
        uses: actions/checkout@v2
      - name: Build binary
        run: make build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23
      - name: Check out code
        uses: actions/checkout@v2
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - name: Build operator image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          load: true
          tags: frp-operator:e2e
          platforms: linux/amd64
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Run e2e suite
        run: make test-e2e E2E_SKIP_IMAGE_BUILD=1
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: output/e2e-artifacts
          if-no-files-found: ignore
