operator:
  image: "ghcr.io/zufardhiyaulhaq/frp-operator"
  tag: "v0.15.0"
  # -- Image pull policy for the operator. `Always` keeps moving tags such as `main` fresh; use `IfNotPresent` for a locally imported image (the e2e suite does).
  imagePullPolicy: Always
  replica: 1

resources:
  limits:
    cpu: 200m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 20Mi

metrics:
  secure: false
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

loadBalancer:
  # -- Bind `Service type=LoadBalancer` with `loadBalancerClass: frp.zufardhiyaulhaq.com/frp` to `ServerPool` servers
  enabled: true

server:
  # -- Maximum number of ports on a Server's public Service (bind, vhost and allowPorts). Cloud load balancers limit listeners.
  maxPorts: 50
